[project]
name = "hkdfguard-hashicorpvault-common"
version = "0.9.0"
description = "What every HkdfGuard integration with HashiCorp Vault shares: the address, path and token checks, the retry limits and backoff, and the error Vault's refusals are reported as."
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/runsecure/hkdfguard-python"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# hkdfguard is a namespace package shared by every hkdfguard-* distribution, and so is
# hkdfguard.hashicorpvault: only this distribution's own subpackage is packed.
[tool.hatch.build.targets.wheel]
only-include = ["src/hkdfguard/hashicorpvault/common"]
sources = ["src"]

[tool.hatch.build]
# Editable installs put src/ (the namespace root) on the path, not src/hkdfguard.
dev-mode-dirs = ["src"]
