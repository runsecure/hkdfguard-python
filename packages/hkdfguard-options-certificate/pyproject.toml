[project]
name = "hkdfguard-options-certificate"
version = "0.9.1"
description = "Plain-data, validated options naming one X.509 certificate - in the Windows store, a macOS keychain, an OpenSSL provider or a password-protected file - and the loader that opens it without exporting an OS-held key."
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hkdfguard-abstractions",
    "hkdfguard-options",
    "cryptography>=47",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/runsecure/hkdfguard-python"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# hkdfguard is a namespace package shared by every hkdfguard-* distribution, and hkdfguard.options
# belongs to hkdfguard-options: only this distribution's own subpackage is packed.
[tool.hatch.build.targets.wheel]
only-include = ["src/hkdfguard/options/certificate"]
sources = ["src"]

[tool.hatch.build]
# Editable installs put src/ (the namespace root) on the path, not src/hkdfguard.
dev-mode-dirs = ["src"]
