[project]
name = "hkdfguard-integration-configurationresolver"
version = "0.9.1"
description = "Resolves the ${name} items in a template - a connection string, a configuration file - from HkdfGuard's protected caches, and caches resolved templates encrypted: the port of HkdfGuard.Integration.ConfigurationResolver, with the parts of ConfigurationResolver it uses."
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hkdfguard-abstractions",
    "hkdfguard-diagnostics",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/runsecure/hkdfguard-python"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# hkdfguard is a namespace package shared by every hkdfguard-* distribution, and so is
# hkdfguard.integration: only this distribution's own subpackage is packed.
[tool.hatch.build.targets.wheel]
only-include = ["src/hkdfguard/integration/configurationresolver"]
sources = ["src"]

[tool.hatch.build]
# Editable installs put src/ (the namespace root) on the path, not src/hkdfguard.
dev-mode-dirs = ["src"]
