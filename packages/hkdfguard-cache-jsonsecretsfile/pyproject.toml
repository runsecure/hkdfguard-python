[project]
name = "hkdfguard-cache-jsonsecretsfile"
version = "0.9.1"
description = "A protected read-only cache over one JSON file holding every secret, already encrypted, as a secret pipeline writes it: read through TrustedFile on the first lookup, every value authenticated under its name, and kept still encrypted."
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hkdfguard-abstractions",
    "hkdfguard-cache",
    "hkdfguard-diagnostics",
    "hkdfguard-securefile",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/runsecure/hkdfguard-python"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# hkdfguard is a namespace package shared by every hkdfguard-* distribution, and hkdfguard.cache
# extends its path to the provider subpackages: only this distribution's own subpackage is packed.
[tool.hatch.build.targets.wheel]
only-include = ["src/hkdfguard/cache/jsonsecretsfile"]
sources = ["src"]

[tool.hatch.build]
# Editable installs put src/ (the namespace root) on the path, not src/hkdfguard.
dev-mode-dirs = ["src"]
