[project]
name = "hkdfguard-keywrapping-googlekms"
version = "0.9.0"
description = "Wraps DEKs under one symmetric Google Cloud KMS key, reading key files only from where no untrusted account could have replaced them."
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hkdfguard-abstractions",
    "hkdfguard-securefile",
    "google-cloud-kms>=3.18",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/runsecure/hkdfguard-python"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# hkdfguard is a namespace package shared by every hkdfguard-* distribution: only this
# distribution's own subpackage is packed.
[tool.hatch.build.targets.wheel]
only-include = ["src/hkdfguard/keywrapping/googlekms"]
sources = ["src"]

[tool.hatch.build]
# Editable installs put src/ (the namespace root) on the path, not src/hkdfguard.
dev-mode-dirs = ["src"]
