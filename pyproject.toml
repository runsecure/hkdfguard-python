# The workspace root: develops and tests the fifteen hkdfguard-* distributions in packages/ together.
# It is not itself a published package.
[project]
name = "hkdfguard-workspace"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "hkdfguard-diagnostics",
    "hkdfguard-abstractions",
    "hkdfguard-cryptoprovider-aesgcm256",
    "hkdfguard-keywrapping-v1",
    "hkdfguard-securefile",
    "hkdfguard-keywrapping-awskms",
    "hkdfguard-keywrapping-azurekeyvault",
    "hkdfguard-keywrapping-googlekms",
    "hkdfguard-dataencryptionkey",
    "hkdfguard-cache",
    "hkdfguard-options",
    "hkdfguard-cache-awssecretsmanager",
    "hkdfguard-cache-azurekeyvault",
    "hkdfguard-cache-googlesecretmanager",
    "hkdfguard-cache-hashicorpvault",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "opentelemetry-sdk>=1.45",
    "ruff>=0.17",
    "mypy>=2.4",
    # DefaultAzureCredential, for hkdfguard-keywrapping-azurekeyvault's integration tests.
    "azure-identity>=1.25",
]
dist = [
    "twine>=7.0.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
hkdfguard-diagnostics = { workspace = true }
hkdfguard-abstractions = { workspace = true }
hkdfguard-cryptoprovider-aesgcm256 = { workspace = true }
hkdfguard-keywrapping-v1 = { workspace = true }
hkdfguard-securefile = { workspace = true }
hkdfguard-keywrapping-awskms = { workspace = true }
hkdfguard-keywrapping-azurekeyvault = { workspace = true }
hkdfguard-keywrapping-googlekms = { workspace = true }
hkdfguard-dataencryptionkey = { workspace = true }
hkdfguard-cache = { workspace = true }
hkdfguard-options = { workspace = true }
hkdfguard-cache-awssecretsmanager = { workspace = true }
hkdfguard-cache-azurekeyvault = { workspace = true }
hkdfguard-cache-googlesecretmanager = { workspace = true }
hkdfguard-cache-hashicorpvault = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib", "-ra"]
# hkdfguard_test_support.py, beside the native tests: what the native integration tests in every package share.
pythonpath = ["packages/hkdfguard-keywrapping-v1/tests"]
markers = ["native: calls the real native KMS library (skipped unless one is installed and provisioned)"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR0913",  # constructors mirror the other ports' parameters
    "PLR2004",  # protocol constants (status codes, sizes) read better inline
    "S101",     # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately use confusable characters and import platform-only modules lazily.
"packages/*/tests/*" = ["S", "PLR", "N802", "B017", "SIM117", "RUF001", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = [
    "packages/hkdfguard-diagnostics/src",
    "packages/hkdfguard-abstractions/src",
    "packages/hkdfguard-cryptoprovider-aesgcm256/src",
    "packages/hkdfguard-keywrapping-v1/src",
    "packages/hkdfguard-securefile/src",
    "packages/hkdfguard-keywrapping-awskms/src",
    "packages/hkdfguard-keywrapping-azurekeyvault/src",
    "packages/hkdfguard-keywrapping-googlekms/src",
    "packages/hkdfguard-dataencryptionkey/src",
    "packages/hkdfguard-cache/src",
    "packages/hkdfguard-options/src",
    # After hkdfguard-cache/src: hkdfguard.cache is a regular package that extends its path to these.
    "packages/hkdfguard-cache-awssecretsmanager/src",
    "packages/hkdfguard-cache-azurekeyvault/src",
    "packages/hkdfguard-cache-googlesecretmanager/src",
    "packages/hkdfguard-cache-hashicorpvault/src",
    "packages/hkdfguard-keywrapping-v1/tests",  # hkdfguard_test_support.py
]
namespace_packages = true
explicit_package_bases = true

# botocore ships no type information. hkdfguard-keywrapping-awskms types the KMS client with a small
# Protocol of the three calls it makes (KmsClient) instead of depending on a stub package, so only
# its two exception imports are untyped.
[[tool.mypy.overrides]]
module = ["botocore", "botocore.*"]
ignore_missing_imports = true

# grpcio ships no type information either. Only hkdfguard-keywrapping-googlekms's tests import it, to
# serve a fake Cloud KMS; the wrapper itself uses google-cloud-kms's typed client.
[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true
