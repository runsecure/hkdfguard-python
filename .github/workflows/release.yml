name: Release

# Publishes the nine hkdfguard-* distributions together.
#
#   * Push a tag "vX.Y.Z" that is on main: tests, builds, checks, and creates a GitHub Release with
#     the wheels and sdists attached, signed with Sigstore build provenance.
#     The tag must equal the version in every packages/*/pyproject.toml.
#   * Run manually (Actions > Release > Run workflow): tests, builds and checks only; nothing is published.
#
# Nothing is published to PyPI or TestPyPI. Nothing here holds a token.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag's commit is compared with main
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: A release tag must be on main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "refs/tags/${TAG}" origin/main \
            || { echo "::error::Tag ${TAG} is not on main; refusing to release it."; exit 1; }

      # The backend that builds what gets attested and published is pinned by version and hash
      # (build-constraints.txt); uv.lock doesn't reach uv build's isolated build environment.
      - run: uv build --all-packages --out-dir dist --build-constraints build-constraints.txt --require-hashes

      - name: Check the distributions (versions, licence, namespace, tag)
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/check-dist.py dist ${TAG:+--tag "$TAG"}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      # After the upload, so no tool run here can change what is attested and released; a failure
      # still fails this job, and nothing downstream runs. twine is pinned by uv.lock (with hashes),
      # never resolved fresh from PyPI at release time.
      - run: uv run --locked --no-build --only-group dist twine check --strict dist/*.whl dist/*.tar.gz

  github-release:
    name: GitHub release with signed provenance
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-release
    permissions:
      contents: write # create the release and upload the files
      id-token: write # Sigstore signs with this run's OIDC identity
      attestations: write # store the signed provenance with the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Signs every file with a keyless Sigstore certificate naming this repository, workflow and
      # tag. Verify a download with: gh attestation verify <file> --repo runsecure/hkdfguard-python
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A version with a pre-release segment (dev, a, b, rc) is marked as a pre-release.
          prerelease=""
          if [[ "${TAG}" =~ (dev|a|b|rc)[0-9]*$ ]]; then prerelease="--prerelease"; fi
          gh release create "${TAG}" dist/*.whl dist/*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${TAG}" --generate-notes ${prerelease}
