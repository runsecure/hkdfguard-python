name: Release

# Publishes the seven hkdfguard-* distributions together.
#
#   * Push a tag "vX.Y.Z" that is on main: tests, builds, checks, and publishes to PyPI.
#     The tag must equal the version in every packages/*/pyproject.toml.
#   * Run manually (Actions > Release > Run workflow): the same, but publishes to TestPyPI.
#
# Nothing here holds a token. PyPI and TestPyPI each trust this workflow file and the matching
# environment below (PyPI "trusted publishing"), and issue a short-lived credential per run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag's commit is compared with main
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: A release tag must be on main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "refs/tags/${TAG}" origin/main \
            || { echo "::error::Tag ${TAG} is not on main; refusing to release it."; exit 1; }

      - run: uv build --all-packages --out-dir dist

      - name: Check the distributions (versions, licence, namespace, tag)
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/check-dist.py dist ${TAG:+--tag "$TAG"}

      - run: uvx twine check --strict dist/*.whl dist/*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/hkdfguard-abstractions/
    permissions:
      id-token: write # the trusted-publishing credential; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true # a re-run of the same version is not an error on the test index

  publish-pypi:
    name: publish to PyPI
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi # give this environment required reviewers: it is the last gate before the public index
      url: https://pypi.org/project/hkdfguard-abstractions/
    permissions:
      id-token: write # the trusted-publishing credential; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true # PEP 740 Sigstore attestations, signed with this run's OIDC identity

  github-release:
    name: GitHub release with signed provenance
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-release
    permissions:
      contents: write # create the release and upload the files
      id-token: write # Sigstore signs with this run's OIDC identity
      attestations: write # store the signed provenance with the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Signs every file with a keyless Sigstore certificate naming this repository, workflow and
      # tag. Verify a download with: gh attestation verify <file> --repo runsecure/hkdfguard-python
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A version with a pre-release segment (dev, a, b, rc) is marked as a pre-release.
          prerelease=""
          if [[ "${TAG}" =~ (dev|a|b|rc)[0-9]*$ ]]; then prerelease="--prerelease"; fi
          gh release create "${TAG}" dist/*.whl dist/*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${TAG}" --generate-notes ${prerelease}
