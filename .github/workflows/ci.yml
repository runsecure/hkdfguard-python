name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs this first

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      # --locked fails if uv.lock is out of date, so CI always tests the versions that were reviewed.
      # --no-build installs third-party packages from wheels only, so no dependency's setup script
      # runs here (this workspace's own packages are still built, from this checkout).
      - run: uv sync --locked --no-build
      # The native KMS tests skip themselves on a runner with no provisioned KEK; they are never reported as passed.
      - run: uv run --locked --no-build pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-build ruff check packages scripts
      - run: uv run --locked --no-build mypy packages

  package:
    name: build and check the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Every package carries an identical copy of the licence
        run: |
          for directory in packages/*/; do
            cmp LICENSE "${directory}LICENSE"
          done
      # The build backend is hash-pinned by build-constraints.txt, as in the release workflow.
      - run: uv build --all-packages --out-dir dist --build-constraints build-constraints.txt --require-hashes
      - run: python3 scripts/check-dist.py dist
      # Pinned by uv.lock, as in the release workflow.
      - run: uv run --locked --no-build --only-group dist twine check --strict dist/*.whl dist/*.tar.gz
